<main class="formContainer">
  <section class="formCard">
    <header class="formHeader">
      <h1 class="formTitle">Add session</h1>
      <p class="formSubtitle">{{ movieTitle || 'Create a movie session' }}</p>
    </header>

    @if (errorMessage) {
      <p class="errorBanner" role="alert">{{ errorMessage }}</p>
    }

    @if (movieId) {
      <form [formGroup]="sessionForm" (ngSubmit)="onSubmit()" class="sessionForm">
        <label class="formGroup">
          Starts at
          <input
            class="formInput"
            type="datetime-local"
            formControlName="startsAt"
            [min]="minStartsAt"
            [max]="maxStartsAt" />
          @if (sessionForm.controls.startsAt.touched && sessionForm.controls.startsAt.errors?.['required']) {
            <span class="fieldError">Choose a start date and time.</span>
          }
          @if (sessionForm.controls.startsAt.touched && sessionForm.controls.startsAt.errors?.['dateRange']) {
            <span class="fieldError">The session must be in the future and within one year.</span>
          }
        </label>

        <label class="formGroup">
          Hall
          <input class="formInput" type="text" maxlength="400" formControlName="hallName" />
          @if (sessionForm.controls.hallName.touched && sessionForm.controls.hallName.invalid) {
            <span class="fieldError">Enter a hall name.</span>
          }
        </label>

        <div class="formRow">
          <label class="formGroup">
            Ticket price
            <input class="formInput" type="number" min="0.01" step="0.01" formControlName="ticketPrice" />
            @if (sessionForm.controls.ticketPrice.touched && sessionForm.controls.ticketPrice.invalid) {
              <span class="fieldError">Price must be greater than zero.</span>
            }
          </label>
          <label class="formGroup">
            Available seats
            <input class="formInput" type="number" min="1" step="1" formControlName="availableSeats" />
            @if (sessionForm.controls.availableSeats.touched && sessionForm.controls.availableSeats.invalid) {
              <span class="fieldError">Enter at least one available seat.</span>
            }
          </label>
        </div>

        <div class="formActions">
          <button class="btn btnSecondary" type="button" (click)="onCancel()" [disabled]="isSubmitting">
            Cancel
          </button>
          <button class="btn btnPrimary" type="submit" [disabled]="isSubmitting || sessionForm.invalid">
            {{ isSubmitting ? 'Saving...' : 'Add session' }}
          </button>
        </div>
      </form>
    }
  </section>
</main>
